services:
  redis:
    image: redis:7-alpine
    container_name: stt-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stt-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      - ./backend:/app

  stt-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stt-worker
    restart: always
    command: ["python", "worker_stt.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      - ./backend:/app

  llm-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stt-llm-worker
    restart: always
    command: ["python", "worker_llm.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stt-frontend
    restart: always
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.example
    depends_on:
      - backend