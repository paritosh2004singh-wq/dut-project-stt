services:
  redis:
    image: redis:7-alpine
    container_name: stt-redis
    restart: always
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stt-backend
    restart: always
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis

  stt-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: stt-worker
    restart: always
    command: ["python", "worker_stt.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis

  llm-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: stt-llm-worker
    restart: always
    command: ["python", "worker_llm.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    container_name: stt-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
